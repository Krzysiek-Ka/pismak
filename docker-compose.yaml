services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: pismak-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pismak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pismak_dev}
      POSTGRES_DB: ${POSTGRES_DB:-pismak}
      # Hasła ról pismak_ingest i pismak_app (docker/postgres/init/002_roles.sql).
      PISMAK_INGEST_DB_PASSWORD: ${PISMAK_INGEST_DB_PASSWORD:-pismak_ingest_dev}
      PISMAK_APP_DB_PASSWORD: ${PISMAK_APP_DB_PASSWORD:-pismak_app_dev}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pismak_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pismak} -d ${POSTGRES_DB:-pismak}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pismak_pgdata:
