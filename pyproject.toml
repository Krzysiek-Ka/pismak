[project]
name = "pismak"
version = "0.2.0"
description = "Asystent AI do przygotowywania pism i wniosków do instytucji publicznych: wywiad, wyszukiwanie źródeł (RAG) i projekt pisma."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
# Zależności: requirements.in (bezpośrednie) i requirements.txt (pełna blokada), README rozdział 8.

[tool.pytest.ini_options]
markers = [
  "golden: złote zbiory jednego modułu na prawdziwych modelach i bazie; tylko ręcznie, przez `-m golden`",
  "e2e: cały pipeline na prawdziwych modelach i bazie; tylko ręcznie, przez `-m e2e`",
]
# Zwykłe `python -m pytest` i CI pomijają złote zbiory i E2E; `-m …` w poleceniu zastępuje
# ten filtr. --strict-markers odrzuca literówkę w nazwie markera zamiast cicho ją ignorować.
addopts = "--strict-markers -m 'not golden and not e2e'"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "outputs",
  "tmp",
  "src/**/*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
